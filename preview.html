<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --text-main: #f1f5f9;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: auto; }

    /* Header & Stats */
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .stats-container { display: flex; gap: 15px; }
    .stat-badge { background: var(--card-bg); padding: 8px 15px; border-radius: 10px; border-left: 4px solid var(--primary); font-size: 14px; }

    /* Filters Card */
    .filter-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    .input-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; }
    
    input, select {
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus { border-color: var(--primary); }

    /* Table Styling */
    .table-container {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }

    .scroll-table { overflow-x: auto; max-height: 500px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    
    thead { position: sticky; top: 0; z-index: 10; }
    th { background: var(--primary); color: white; padding: 15px; font-weight: 600; text-transform: uppercase; }
    
    td { padding: 12px 15px; border-bottom: 1px solid #334155; }
    tr:hover { background: #2d3748; transition: 0.2s; }

    /* Tags & Badges */
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .ca-1 { background: #065f46; color: #34d399; }
    .ca-2 { background: #92400e; color: #fbbf24; }
    .ca-3 { background: #1e40af; color: #93c5fd; }
    .type-xuattai { border: 1px solid var(--warning); color: var(--warning); }

    .btn-export {
      background: var(--success);
      color: white; border: none; padding: 12px 20px;
      border-radius: 8px; cursor: pointer; font-weight: bold;
      transition: 0.3s;
    }
    .btn-export:hover { filter: brightness(1.2); }

    /* Loading Overlay */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; z-index: 9999;
    }
    .loader {
      border: 5px solid #334155; border-top: 5px solid var(--primary);
      border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>

<div id="loading">
  <div class="loader"></div>
  <p style="margin-top: 15px;">Đang tải dữ liệu thời gian thực...</p>
</div>

<div class="container">
  <div class="header-section">
    <h2><i class="fas fa-bolt" style="color:var(--warning)"></i> DASHBOARD ĐIỀU PHỐI</h2>
    <div class="stats-container">
      <div class="stat-badge">Tổng: <span id="count-total">0</span></div>
      <div class="stat-badge">Tìm thấy: <span id="count-found">0</span></div>
      <button class="btn-export" onclick="exportExcel()"><i class="fas fa-file-excel"></i> EXPORT</button>
    </div>
  </div>

  <div class="filter-card">
    <div class="input-group">
      <label>Tìm nhanh</label>
      <input id="search" placeholder="Tên, Biển số, ID...">
    </div>
    
    <div class="input-group">
      <label>Ca làm việc</label>
      <select id="ca">
        <option value="">Tất cả các ca</option>
        <option value="ca 1">Ca 1 (Sáng)</option>
        <option value="ca 2">Ca 2 (Chiều)</option>
        <option value="ca 3">Ca 3 (Đêm)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Đội xuất tải</label>
      <select id="team-select"><option value="">Tất cả đội</option></select>
    </div>

    <div class="input-group">
      <label>Vị trí</label>
      <select id="pos-select"><option value="">Tất cả vị trí</option></select>
    </div>
  </div>

  <div class="table-container">
    <div class="scroll-table">
      <table>
        <thead>
          <tr>
            <th>Nhân viên</th>
            <th>Thông tin Ca</th>
            <th>Vị trí</th>
            <th>Đội</th>
            <th>Phương tiện</th>
            <th>Vận đơn (ID/Trip)</th>
            <th>Lộ trình</th>
            <th>STD</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let DATA = [];

// Hàm hỗ trợ tìm kiếm không dấu
function cleanStr(s) {
  return (s || "").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function f(r, keys) {
  for (let k of keys) {
    if (r[k] && r[k] !== "") return r[k];
  }
  return "-";
}

function updateDropdowns() {
  const teams = new Set();
  const positions = new Set();
  
  DATA.forEach(r => {
    const t = f(r, ["đội xuất tải", "đội"]);
    const p = f(r, ["vị trí"]);
    if(t !== "-") teams.add(t);
    if(p !== "-") positions.add(p);
  });

  const teamSel = document.getElementById("team-select");
  const posSel = document.getElementById("pos-select");

  teams.forEach(t => teamSel.innerHTML += `<option value="${t}">${t}</option>`);
  positions.forEach(p => posSel.innerHTML += `<option value="${p}">${p}</option>`);
}

function render() {
  const s = cleanStr(document.getElementById("search").value);
  const ca = cleanStr(document.getElementById("ca").value);
  const team = cleanStr(document.getElementById("team-select").value);
  const pos = cleanStr(document.getElementById("pos-select").value);

  const filtered = DATA.filter(r => {
    const rowStr = cleanStr(JSON.stringify(r));
    return (
      (!s || rowStr.includes(s)) &&
      (!ca || cleanStr(r._sheet).includes(ca)) &&
      (!team || cleanStr(f(r, ["đội xuất tải", "đội"])).includes(team)) &&
      (!pos || cleanStr(f(r, ["vị trí"])).includes(pos))
    );
  });

  document.getElementById("count-found").innerText = filtered.length;
  const tbody = document.getElementById("tb");
  tbody.innerHTML = "";

  filtered.forEach(r => {
    const caNum = r._sheet.split(' ')[1];
    const tr = document.createElement("tr");
    
    tr.innerHTML = `
      <td><strong>${f(r, ["họ tên", "tên"])}</strong></td>
      <td>
        <span class="badge ca-${caNum}">${r._sheet}</span><br>
        <small style="color:var(--text-dim)">${r._type}</small>
      </td>
      <td>${f(r, ["vị trí"])}</td>
      <td><b style="color:var(--primary)">${f(r, ["đội xuất tải", "đội"])}</b></td>
      <td><i class="fas fa-truck"></i> ${f(r, ["biển số"])}</td>
      <td>
        ID: ${f(r, ["id"])}<br>
        <small>Trip: ${f(r, ["trip"])}</small>
      </td>
      <td>${f(r, ["điểm đến"])}</td>
      <td style="color:var(--warning); font-weight:bold">${f(r, ["std", "giờ"])}</td>
    `;
    tbody.appendChild(tr);
  });
}

function exportExcel() {
  let csv = "\uFEFF"; // BOM để hiển thị tiếng Việt
  const headers = ["Họ Tên", "Ca", "Vị Trí", "Đội", "Biển Số", "ID", "Trip", "Điểm Đến", "STD"];
  csv += headers.join(",") + "\n";

  DATA.forEach(r => {
    const row = [
      f(r, ["họ tên", "tên"]), r._sheet, f(r, ["vị trí"]), 
      f(r, ["đội xuất tải", "đội"]), f(r, ["biển số"]),
      f(r, ["id"]), f(r, ["trip"]), f(r, ["điểm đến"]), f(r, ["std", "giờ"])
    ];
    csv += row.map(v => `"${v}"`).join(",") + "\n";
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `Bao_Cao_Dieu_Phoi_${new Date().toLocaleDateString()}.csv`;
  link.click();
}

// Gán sự kiện
["search", "ca", "team-select", "pos-select"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});

function load() {
  google.script.run.withSuccessHandler(res => {
    DATA = res;
    document.getElementById("count-total").innerText = DATA.length;
    updateDropdowns();
    render();
    document.getElementById("loading").style.display = "none";
  }).getData();
}

window.onload = load;
</script>

</body>
</html>
