<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Tra cứu Dữ liệu Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-body: #f4f7f6; --bg-card: #ffffff; --text-color: #333; }
        [data-bs-theme="dark"] { --bg-body: #1a1d20; --bg-card: #2b3035; --text-color: #f8f9fa; }

        body { background-color: var(--bg-body); color: var(--text-color); transition: all 0.3s; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { background: var(--bg-card); border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; }
        .header-title { background: linear-gradient(90deg, #0d6efd, #0dcaf0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        /* Tùy chỉnh bảng */
        table.dataTable thead th { background-color: #0d6efd !important; color: white !important; border-bottom: none; }
        .dataTables_wrapper .dataTables_filter input { border-radius: 20px; padding: 5px 15px; border: 1px solid #ddd; }
        .dt-buttons .btn { border-radius: 20px; font-size: 13px; margin-right: 5px; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        [data-bs-theme="dark"] #loading-overlay { background: rgba(0,0,0,0.8); }
        
        footer { margin-top: 30px; text-align: center; font-size: 0.9rem; opacity: 0.7; }
    </style>
</head>
<body data-bs-theme="light">

<div id="loading-overlay">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <p class="mt-3 fw-bold">Đang đồng bộ dữ liệu từ Google Sheets...</p>
</div>

<div class="container-fluid max-width-xl">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="header-title"><i class="fas fa-database me-2"></i>HỆ THỐNG TRA CỨU DATA</h2>
        <button id="theme-toggle" class="btn btn-outline-secondary rounded-circle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="main-card">
        <div id="toolbar" class="mb-3"></div>

        <div class="table-responsive">
            <table id="pro-table" class="table table-hover w-100" style="display:none;">
                <thead>
                    <tr id="table-header"></tr>
                </thead>
                <tbody id="table-body"></tbody>
                <tfoot>
                    <tr id="table-footer"></tr>
                </tfoot>
            </table>
        </div>
    </div>

    <footer>
        &copy; 2024 - Dữ liệu được cập nhật trực tiếp từ Google Sheets
    </footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

<script>
    const SHEET_ID = '1khd3XaovH5B7fHg4f0JM7yIFWxNM7W97CAK3QkiSukk';
    const SHEET_TITLE = 'Sheet1'; 
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_TITLE}`;

    async function loadData() {
        try {
            const response = await fetch(CSV_URL);
            const csvText = await response.text();
            
            // Hàm parse CSV chuyên sâu xử lý dấu phẩy trong ngoặc kép
            const rows = parseCSV(csvText);

            if (rows.length > 0) {
                const header = rows[0];
                const body = rows.slice(1);

                // Render Header & Footer (để lọc từng cột)
                header.forEach(col => {
                    $('#table-header').append(`<th>${col}</th>`);
                    $('#table-footer').append(`<th><input type="text" class="form-control form-control-sm" placeholder="Lọc ${col}..." /></th>`);
                });

                // Render Body
                body.forEach(rowData => {
                    if (rowData.join('').trim() === "") return;
                    let tr = '<tr>';
                    rowData.forEach(cell => tr += `<td>${cell}</td>`);
                    tr += '</tr>';
                    $('#table-body').append(tr);
                });

                // Khởi tạo DataTables với tính năng nâng cao
                const table = $('#pro-table').DataTable({
                    dom: '<"d-flex justify-content-between"Bf>rt<"d-flex justify-content-between"ip>',
                    buttons: [
                        { extend: 'copy', className: 'btn-secondary' },
                        { extend: 'excel', className: 'btn-success', title: 'Data_Export' },
                        { extend: 'pdf', className: 'btn-danger', title: 'Data_Export' },
                        { extend: 'print', className: 'btn-info' }
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/vi.json' },
                    pageLength: 15,
                    initComplete: function () {
                        // Thiết lập tìm kiếm theo từng cột
                        this.api().columns().every(function () {
                            const that = this;
                            $('input', this.footer()).on('keyup change clear', function () {
                                if (that.search() !== this.value) {
                                    that.search(this.value).draw();
                                }
                            });
                        });
                    }
                });

                $('#pro-table').show();
                $('#loading-overlay').fadeOut();
            }
        } catch (err) {
            alert("Lỗi tải dữ liệu. Hãy đảm bảo Sheet đã được Share 'Bất kỳ ai có link'.");
            console.error(err);
        }
    }

    function parseCSV(text) {
        const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
        return text.split('\n').map(row => row.split(regex).map(cell => cell.replace(/^"(.*)"$/, '$1').trim()));
    }

    // Toggle Dark Mode
    $('#theme-toggle').click(function() {
        const body = $('body');
        if (body.attr('data-bs-theme') === 'dark') {
            body.attr('data-bs-theme', 'light');
            $(this).html('<i class="fas fa-moon"></i>');
        } else {
            body.attr('data-bs-theme', 'dark');
            $(this).html('<i class="fas fa-sun"></i>');
        }
    });

    $(document).ready(loadData);
</script>

</body>
</html>
